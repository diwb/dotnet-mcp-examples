name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore DotNetMcpExamples.slnx
      - run: dotnet build DotNetMcpExamples.slnx -c Release --no-restore
      - run: dotnet test DotNetMcpExamples.slnx -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: TestResults
